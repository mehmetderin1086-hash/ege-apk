name: EzanVaktiPro
options:
  bundleIdPrefix: com.mehmetderin
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "2.0"
    CURRENT_PROJECT_VERSION: "20"
    DEVELOPMENT_TEAM: "838FF89FZ8"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    SWIFT_VERSION: "5.10"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: YES
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

packages:
  Adhan:
    url: https://github.com/batoulapps/adhan-swift
    from: "1.4.0"

targets:
  EzanVaktiPro:
    type: application
    platform: iOS
    sources:
      - path: Sekine
        excludes:
          - Resources/ElifBaAudio
          - Resources/QuranTiming
          - Resources/QuranSearch
      - path: Sekine/Resources/QuranSearch
        type: folder
        buildPhase: resources
      - path: Sekine/Resources/QuranTiming
        type: folder
        buildPhase: resources
      - path: Sekine/Resources/ElifBaAudio
        type: folder
        buildPhase: resources
    dependencies:
      - package: Adhan
        product: Adhan
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mehmetderin.ezanvaktipro
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: AppIcon-Cinar
        INFOPLIST_KEY_CFBundleDisplayName: "Secde Vakti"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Namaz vakitlerini, kıble pusulasını ve yakındaki camileri bulunduğunuz konuma göre Diyanet'e uygun hesaplamak için konumunuz kullanılır."
        INFOPLIST_KEY_NSLocationAlwaysAndWhenInUseUsageDescription: "Namaz vakitlerini konumunuza göre hesaplamak için konum izni kullanılır."
        CODE_SIGN_ENTITLEMENTS: Sekine/Sekine.entitlements
    info:
      path: Sekine/Info.plist
      properties:
        NSSupportsLiveActivities: true
        UIBackgroundModes:
          - fetch
          - processing
          - audio
        BGTaskSchedulerPermittedIdentifiers:
          - com.sekineapp.sekine.refresh
          - com.sekineapp.sekine.nightly
        CFBundleLocalizations:
          - tr
          - en
        CFBundleDevelopmentRegion: tr
        UIAppFonts:
          - AmiriQuran-Regular.ttf
          - Amiri-Regular.ttf
          - Amiri-Bold.ttf
          - ScheherazadeNew-Regular.ttf
          - ScheherazadeNew-Bold.ttf
          - Lateef-Regular.ttf
          - NotoNaskhArabic.ttf
          - NotoSansArabic.ttf
          - Lora.ttf
          - SourceSerif4.ttf
          - Roboto.ttf

  EzanVaktiProTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: EzanVaktiProTests
    dependencies:
      - target: EzanVaktiPro

  EzanVaktiProUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: EzanVaktiProUITests
    dependencies:
      - target: EzanVaktiPro

schemes:
  EzanVaktiPro:
    build:
      targets:
        EzanVaktiPro: all
    test:
      config: Debug
      targets:
        - EzanVaktiProTests
        - EzanVaktiProUITests
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
