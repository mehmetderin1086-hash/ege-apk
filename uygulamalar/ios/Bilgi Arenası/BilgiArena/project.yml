name: BilgiArena
options:
  bundleIdPrefix: com.mehmetderin
  deploymentTarget:
    iOS: '18.0'
packages:
  ArgmaxOSS:
    path: Vendor/ArgmaxOSS
  ProxyKit:
    path: Vendor/ProxyKit
settings:
  base:
    SWIFT_VERSION: '5.0'
    DEVELOPMENT_TEAM: 838FF89FZ8
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: '1'
targets:
  BilgiArena:
    type: application
    platform: iOS
    sources: [Sources]
    info:
      path: Sources/Info.plist
      properties:
        NSMicrophoneUsageDescription: Sesli cevaplar Whisper ile cihazda çözümlenir; canlı API seçersen ses, seçtiğin sağlayıcıya gönderilir.
        UIBackgroundModes: [processing]
        BGTaskSchedulerPermittedIdentifiers: [com.mehmetderin.bilgiarena.daily-pool]
    dependencies:
      - package: ProxyKit
      - package: ArgmaxOSS
        product: WhisperKit
    entitlements:
      path: Sources/BilgiArena.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.mehmetderin.bilgiarena
          - $(AppIdentifierPrefix)com.mehmetderin.ortak
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.mehmetderin.bilgiarena
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Bilgi Arenası
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        MARKETING_VERSION: '2.7.0'
        CURRENT_PROJECT_VERSION: '12'
  BilgiArenaTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: BilgiArena
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  BilgiArenaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: BilgiArena
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  BilgiArena:
    build:
      targets:
        BilgiArena: all
    test:
      targets: [BilgiArenaTests, BilgiArenaUITests]
