name: CLIProxy
options:
  bundleIdPrefix: com.mehmetderin
  deploymentTarget:
    iOS: "27.0"
  developmentLanguage: tr
  createIntermediateGroups: true
  xcodeVersion: "27.0"

packages:
  ProxyKit:
    path: ProxyKit

settings:
  base:
    DEVELOPMENT_TEAM: 838FF89FZ8
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    TARGETED_DEVICE_FAMILY: "1,2"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

targets:
  CLIProxy:
    type: application
    platform: iOS
    sources:
      - path: CLIProxy
    dependencies:
      - package: ProxyKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mehmetderin.cliproxy
        CODE_SIGN_ENTITLEMENTS: CLIProxy/CLIProxy.entitlements
    info:
      path: CLIProxy/Info.plist
      properties:
        CFBundleDisplayName: CLI Proxy
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes: [audio]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: false
        NSLocalNetworkUsageDescription: "Vekil sunucusunu aynı Wi-Fi ağındaki bilgisayarlara açmak için yerel ağ izni gerekir."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSPhotoLibraryUsageDescription: "Sohbette modele fotoğraf göndermek için."
