name: IETTAsistan
options:
  bundleIdPrefix: com.mehmetderin
  deploymentTarget:
    iOS: '26.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    DEVELOPMENT_TEAM: 838FF89FZ8
    CODE_SIGN_STYLE: Automatic
targets:
  IETTAsistan:
    type: application
    platform: iOS
    sources:
      - Sources
      - Shared
      - path: Seed
        type: folder
    configFiles:
      Debug: Secrets.xcconfig
      Release: Secrets.xcconfig
    entitlements:
      path: Sources/IETTAsistan.entitlements
      properties:
        com.apple.security.application-groups: [group.com.mehmetderin.iettasistan]
    dependencies:
      - target: IETTWidget
    info:
      path: Sources/Info.plist
      properties:
        UIBackgroundModes: [fetch]
        LSApplicationQueriesSchemes: [whatsapp]
        BGTaskSchedulerPermittedIdentifiers: [com.mehmetderin.iettasistan.refresh]
        VoiceServerHost: $(SERVER_HOST)
        VoiceServerToken: $(PERSONAL_TOKEN)
        CFBundleURLTypes:
          - CFBundleURLName: com.mehmetderin.iettasistan
            CFBundleURLSchemes: [iettasistan]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mehmetderin.iettasistan
        PRODUCT_NAME: IETTAsistan
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Otobüs Asistanı
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Sesli asistan, sorunu konuşarak sormanı sağlamak için mikrofonu kullanır.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Sesli asistan, söylediklerini metne çevirmek için konuşma tanımayı kullanır.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Yakınındaki durakları ve otobüsleri göstermek için konumunu kullanır.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: '1'
  IETTWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    entitlements:
      path: Widget/IETTWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.mehmetderin.iettasistan]
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Otobüs dakikası
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mehmetderin.iettasistan.widget
        TARGETED_DEVICE_FAMILY: '1'
        SKIP_INSTALL: YES
  IETTAsistanTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: IETTAsistan
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.mehmetderin.iettasistan.tests
schemes:
  IETTAsistan:
    build:
      targets:
        IETTAsistan: all
        IETTAsistanTests: [test]
    test:
      targets: [IETTAsistanTests]
