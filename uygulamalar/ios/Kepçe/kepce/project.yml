name: Kepce
options:
  bundleIdPrefix: com.mehmetderin
  deploymentTarget:
    iOS: "27.0"
  developmentLanguage: tr
  createIntermediateGroups: true
  xcodeVersion: "27.0"

settings:
  base:
    DEVELOPMENT_TEAM: 838FF89FZ8
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_STRICT_CONCURRENCY: complete
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Kepce:
    type: application
    platform: iOS
    sources:
      - path: Kepce
      - path: Ortak
    dependencies:
      - framework: Bagimliliklar/Python.xcframework
        embed: true
      - target: KepcePaylas
        embed: true
    postBuildScripts:
      - name: Python ve yt-dlp
        script: "\"$PROJECT_DIR/araclar/python-kur.sh\""
        basedOnDependencyAnalysis: false
    entitlements:
      path: Kepce/Kepce.entitlements
      properties:
        com.apple.security.application-groups: [group.com.mehmetderin.kepce]
    info:
      path: Kepce/Info.plist
      properties:
        CFBundleDisplayName: Kepçe
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes: [audio, processing]
        BGTaskSchedulerPermittedIdentifiers: [com.mehmetderin.kepce.indir.*]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        LSApplicationQueriesSchemes: [whatsapp]
        NSPhotoLibraryAddUsageDescription: "İndirdiğin videoları Fotoğraflar'a kaydetmek için."
        CFBundleURLTypes:
          - CFBundleURLName: com.mehmetderin.kepce
            CFBundleURLSchemes: [kepce]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mehmetderin.kepce
        PRODUCT_NAME: Kepce
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_OBJC_BRIDGING_HEADER: Kepce/Motor/Kepce-Bridging-Header.h
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  KepcePaylas:
    type: app-extension
    platform: iOS
    sources:
      - path: KepcePaylas
      - path: Ortak
    entitlements:
      path: KepcePaylas/KepcePaylas.entitlements
      properties:
        com.apple.security.application-groups: [group.com.mehmetderin.kepce]
    info:
      path: KepcePaylas/Info.plist
      properties:
        CFBundleDisplayName: Kepçe
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PaylasimDenetcisi
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mehmetderin.kepce.paylas
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        ENABLE_USER_SCRIPT_SANDBOXING: YES

  KepceTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: KepceTests
    dependencies:
      - target: Kepce
    settings:
      base:
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Kepce.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Kepce
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  Kepce:
    build:
      targets:
        Kepce: all
        KepceTests: [test]
    test:
      targets: [KepceTests]
      environmentVariables:
        KEPCE_CANLI: $(KEPCE_CANLI)
