name: Ritim
options:
  deploymentTarget:
    iOS: '17.0'
  xcodeVersion: '27.1'
settings:
  base:
    SWIFT_VERSION: '5.0'
    DEVELOPMENT_TEAM: 838FF89FZ8
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: '1.10.0'
    CURRENT_PROJECT_VERSION: 12
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  YouTubeKit:
    url: https://github.com/alexeichhorn/YouTubeKit
    revision: 89854c93207ad0d2b3d78d6f1aea24595ca66552
  Lame:
    path: Vendor/Lame
targets:
  Ritim:
    type: application
    platform: iOS
    sources:
      - path: Ritim
        excludes: [Info.plist]
      - path: ThirdPartyNotices.md
        buildPhase: resources
      - path: Vendor/Lame/COPYING
        buildPhase: resources
      - path: Vendor/Lame/LICENSE
        buildPhase: resources
    dependencies:
      - package: YouTubeKit
      - framework: Vendor/KepceMotor/Python.xcframework
        embed: true
      - package: Lame
        product: CLame
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mehmetderin.ritim
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SWIFT_OBJC_BRIDGING_HEADER: Ritim/Core/KepceMotor/Ritim-Bridging-Header.h
        INFOPLIST_FILE: Ritim/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    postBuildScripts:
      - name: Package Kepce Python
        script: '"$PROJECT_DIR/scripts/kepce-motor-pack.sh"'
        basedOnDependencyAnalysis: false
    info:
      path: Ritim/Info.plist
      properties:
        CFBundleDisplayName: Ritim
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIBackgroundModes: [audio, processing]
        BGTaskSchedulerPermittedIdentifiers: [com.mehmetderin.ritim.processing, "com.mehmetderin.ritim.continued.*"]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UISupportsDocumentBrowser: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Ses ve video
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.audio, public.movie]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        ITSAppUsesNonExemptEncryption: false
  RitimTests:
    type: bundle.unit-test
    platform: iOS
    sources: [RitimTests]
    dependencies:
      - target: Ritim
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mehmetderin.ritim.tests
        GENERATE_INFOPLIST_FILE: YES
  RitimUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [RitimUITests]
    dependencies:
      - target: Ritim
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mehmetderin.ritim.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Ritim:
    build:
      targets:
        Ritim: all
    test:
      targets: [RitimTests, RitimUITests]
