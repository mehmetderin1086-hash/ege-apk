[project]
name = "downloadhub"
version = "0.1.0"
description = "Local-first web download manager for macOS"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-only"
authors = [{ name = "DownloadHub contributors" }]
dependencies = [
  "aiosqlite>=0.21.0",
  "alembic>=1.16.0",
  "fastapi>=0.116.0",
  "greenlet>=3.2.3",
  "httpx>=0.28.0",
  "imageio-ffmpeg>=0.6.0",
  "jinja2>=3.1.6",
  "platformdirs>=4.3.8",
  "pydantic-settings>=2.10.0",
  "python-multipart>=0.0.20",
  "sqlalchemy>=2.0.41",
  "uvicorn[standard]>=0.35.0",
  "yt-dlp[default]>=2025.11.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.0",
  "pytest-asyncio>=1.0.0",
  "pytest-cov>=6.2.0",
  "ruff>=0.12.0",
]
package = ["pyinstaller>=6.14.0"]

[project.scripts]
downloadhub = "downloadhub.main:main"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/downloadhub"]
include = [
  "src/downloadhub/static/**",
  "src/downloadhub/templates/**",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 110
extend-exclude = ["build", "dist", "runtime"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
ignore = ["ASYNC240"]

[tool.ruff.lint.per-file-ignores]
"src/downloadhub/app.py" = ["B008"]
