[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "kitapkatalog"
version = "1.0.0"
description = "Cumhuriyet Kitap — beş OCR motorlu, dört yüzlü çevrimdışı okul kütüphane otomasyonu"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Mehmet Derin" }]
dependencies = [
  "openpyxl>=3.1.5,<4",
  "Pillow>=11.3,<13",
  "pillow-heif>=1.1,<2",
  "platformdirs>=4.3,<5",
  "psutil>=7.0,<8",
  "pypdfium2>=5.12,<6",
  "pydantic>=2.11,<3",
  "zstandard>=0.23,<1",
  "fastapi>=0.141.1",
  "uvicorn>=0.52.1",
  "python-multipart>=0.0.32",
]

[project.optional-dependencies]
vision = [
  "numpy>=2.2,<3",
  "opencv-python>=4.11,<6",
  "zxing-cpp>=2.3,<3",
]
# PySide6 6.11.1'in macOS universal tekerindeki QPA eklentileri bazı
# Apple-Silicon kurulumlarında yüklenemiyor. Görsel smoke testi yapılmış
# sürümü sabitleyerek masaüstü paketini yeniden üretilebilir tutuyoruz.
ui = ["PySide6==6.10.2"]
# Sesli kitap kaydı: PyAV ffmpeg'i tekerin içinde taşır; sistem ffmpeg gerekmez.
voice = ["av>=14,<16"]
rapidocr = [
  "numpy>=2.2,<3",
  "onnxruntime>=1.22,<2",
  "rapidocr>=3.9,<4",
]
easyocr = [
  "easyocr==1.7.2",
  "torch>=2.7,<3",
  "torchvision>=0.22,<1",
]
build = [
  "Nuitka>=2.7,<3",
  "ordered-set>=4.1,<5",
  "pip>=25,<26",
  "PyInstaller==6.21.0",
  "pyinstaller-hooks-contrib==2026.6",
]
dev = [
  "playwright>=1.40,<2",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<8",
  "pytest-qt>=4.5,<5",
  "ruff>=0.12,<1",
]

[project.scripts]
kitapkatalog = "kitapkatalog.cli:main"
kitapkatalog-gui = "kitapkatalog.gui:main"
kitapkatalog-web = "kitapkatalog.webapp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kitapkatalog"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["work", "outputs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# Türkçe kullanıcı metnindeki I/İ/ı/i ayrımını bilinçli olarak koruyoruz.
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
]
