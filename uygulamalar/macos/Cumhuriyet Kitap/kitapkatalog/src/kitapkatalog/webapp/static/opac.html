<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cumhuriyet Kitap — Katalog</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#14161b" media="(prefers-color-scheme: dark)">
  <style>
    .opac-wrap { max-width: 800px; margin: 0 auto; padding: var(--sp-7) var(--sp-5) var(--sp-8); }
    .opac-baslik { text-align: center; margin-bottom: var(--sp-6); }
    .opac-ara { width: 100%; font-size: var(--fs-xl); padding: 16px 20px; border-radius: var(--radius-lg);
                border: 2px solid var(--accent); background: var(--surface); color: var(--ink); min-height: 48px; }
    .opac-kart { background: var(--surface); border-radius: var(--radius-lg); padding: var(--sp-4) var(--sp-5);
                 margin: var(--sp-3) 0; box-shadow: var(--shadow); border: 1px solid var(--line);
                 display: flex; gap: var(--sp-4); align-items: center; }
    .opac-kart h3 { margin: 0 0 4px; font-size: var(--fs-md); }
    .opac-kart-metin { flex: 1; min-width: 0; }
    .opac-kapak { width: 60px; height: 84px; object-fit: cover; border-radius: 8px;
                  flex-shrink: 0; background: var(--surface-2); }
    .opac-kapak-bos { display: flex; align-items: center; justify-content: center;
                      font-size: 28px; }
    .opac-durum { font-weight: 700; display: inline-flex; align-items: center; gap: 4px; }
    .opac-durum.var { color: var(--ok-fg); }
    .opac-durum.yok { color: var(--danger-fg); }
    .opac-meta { color: var(--ink-2); font-size: var(--fs-sm); }
    .opac-filtre { display: flex; gap: var(--sp-3); margin-top: var(--sp-3); flex-wrap: wrap; align-items: center; }
    .opac-filtre select { flex: 1 1 160px; width: auto; min-height: 44px; }
    .opac-filtre label { display: flex; align-items: center; gap: 6px; font-size: var(--fs-base); min-height: 44px; }
    .opac-sekmeler { display: flex; gap: var(--sp-2); justify-content: center; margin: var(--sp-4) 0 var(--sp-2); flex-wrap: wrap; }
    .opac-sekme { border: 1px solid var(--line); background: var(--surface); color: var(--ink);
                  border-radius: 999px; padding: 10px 18px; cursor: pointer; font-size: var(--fs-sm); min-height: 44px; }
    .opac-sekme.aktif { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
    .opac-liste-kart { background: var(--surface); border-radius: var(--radius-lg); padding: var(--sp-5);
                        margin: var(--sp-3) 0; box-shadow: var(--shadow); border: 1px solid var(--line); }
    .opac-liste-kart h3 { margin: 0 0 4px; }
    .opac-liste-vitrin { display: flex; gap: var(--sp-3); overflow-x: auto; padding: 8px 0 4px; }
    .opac-liste-kitap { flex-shrink: 0; width: 76px; text-align: center; font-size: 12px; }
    .opac-liste-kitap img, .opac-liste-kitap .opac-kapak-bos { width: 76px; height: 104px; }
    .opac-liste-kitap .opac-kapak-bos { display: flex; align-items: center; justify-content: center;
                                         border-radius: 8px; background: var(--surface-2); font-size: 26px; }
    .opac-bos { text-align: center; padding: var(--sp-8) var(--sp-4); color: var(--ink-2); }
    .opac-bos .empty-state-icon { width: 84px; height: 84px; }
  </style>
</head>
<body>
  <a class="skip-link" href="#opac-ana">Ana içeriğe geç</a>
  <main class="opac-wrap" id="opac-ana" tabindex="-1">
    <div class="opac-baslik">
      <h1>📚 Kütüphane Kataloğu</h1>
      <p class="hint">Kitap adı, yazar ya da konu yazarak arayın.</p>
    </div>
    <label class="sr-only" for="opac-ara">Kitap adı, yazar veya konu ara</label>
    <input type="search" id="opac-ara" class="opac-ara" placeholder="Kitap ara…" autofocus autocomplete="off">
    <div class="opac-filtre">
      <label class="sr-only" for="opac-kategori">Kategori</label>
      <select id="opac-kategori"><option value="">Tüm kategoriler</option></select>
      <label><input type="checkbox" id="opac-rafta"> Yalnız rafta olanlar</label>
    </div>
    <div class="opac-sekmeler" id="opac-sekmeler" role="tablist" aria-label="Katalog görünümü">
      <button class="opac-sekme aktif" id="opac-tab-search" data-sekme="" role="tab"
              aria-selected="true" aria-controls="opac-panel" tabindex="0">Arama</button>
      <button class="opac-sekme" id="opac-tab-new" data-sekme="new" role="tab"
              aria-selected="false" aria-controls="opac-panel" tabindex="-1">🆕 Yeni Gelenler</button>
      <button class="opac-sekme" id="opac-tab-popular" data-sekme="popular" role="tab"
              aria-selected="false" aria-controls="opac-panel" tabindex="-1">⭐ Popüler</button>
      <button class="opac-sekme" id="opac-tab-lists" data-sekme="lists" role="tab"
              aria-selected="false" aria-controls="opac-panel" tabindex="-1">📚 Listeler</button>
    </div>
    <div id="opac-panel" role="tabpanel" aria-labelledby="opac-tab-search" tabindex="0">
      <div id="opac-sonuc"></div>
      <p id="opac-bilgi" class="hint" role="status" aria-live="polite" style="text-align:center"></p>
    </div>
  </main>
  <script type="module" src="/static/js/opac.js"></script>
</body>
</html>
