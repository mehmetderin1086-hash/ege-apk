[project]
name = "pdf-studio"
version = "1.0.0"
description = "PDF Studio — iLovePDF benzeri gelişmiş, yerel PDF düzenleme uygulaması"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "PDF Studio" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "pymupdf>=1.24",
    "pikepdf>=8.0",
    "pillow>=10.0",
    "numpy>=1.26",
    "pdf2docx>=0.5.8",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "rapidocr-onnxruntime>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.uv]
package = false
