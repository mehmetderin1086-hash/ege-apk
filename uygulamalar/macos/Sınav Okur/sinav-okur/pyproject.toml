[project]
name = "sinav-okur"
version = "0.1.0"
description = "Türkçe el yazısı sınavları (açık uçlu, kısa cevap, boşluk doldurma) okuyan ve puanlayan sistem"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.8",
    "pillow>=10.0",
    "rapidfuzz>=3.5",
    "pyyaml>=6.0",
    "fonttools>=4.47",
    "pypdfium2>=4.25",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
htr = ["torch>=2.2", "transformers>=4.40,<5", "sentencepiece>=0.2"]
gomme = ["sentence-transformers>=3.0"]
mlx = ["mlx-vlm>=0.1"]
hfveri = ["datasets>=2.14"]
keras = ["tensorflow>=2.16,<2.22"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
sinav-okur = "sinav_okur.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sinav_okur"]

[tool.pytest.ini_options]
testpaths = ["tests"]
