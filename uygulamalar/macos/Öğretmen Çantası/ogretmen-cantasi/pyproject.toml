[project]
name = "ogretmen-cantasi"
version = "0.3.0"
description = "Biyoloji öğretmeni için yerel ders planı, not defteri, yoklama ve sınav programı"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1",
    "python-docx>=1.1",
    # Hem müfredat PDF'inin çıkarımı hem de plan/sınav PDF'lerinin üretimi
    # (Story API) buna dayanıyor; ek sistem kütüphanesi istemiyor.
    "pymupdf>=1.24",
    # Sesli yoklamada duyulan adı sınıf listesindeki adla eşleştirmek için.
    "rapidfuzz>=3.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    # starlette 1.3 TestClient'ı httpx yerine httpx2 kullanıyor (kardeş
    # projede aynı geçiş yapıldı; eski paket her koşuda uyarı basıyordu).
    "httpx2>=2.9",
    "ruff>=0.9",
    "pyinstaller>=6.15",
]

[project.scripts]
ogretmen-cantasi = "ogretmen_cantasi.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ogretmen_cantasi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["ogretmen_cantasi"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "BLE", "S", "SLF", "C4", "SIM", "RUF"]
ignore = [
    "E501",   # satır uzunluğu formatter'ın işi
    "RUF001", # Türkçe metinlerde "belirsiz" unicode uyarısı gürültüden ibaret
    "RUF002",
    "RUF003",
    "S608",   # SQL dizgi kurulumu: ORM yok, şema tek dosyada toplandı
    "B008",   # FastAPI'nin Form()/Depends() varsayılan-argüman deyimi
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "SLF001"]
"scripts/*" = ["S101"]
