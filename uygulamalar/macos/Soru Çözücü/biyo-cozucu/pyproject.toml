[project]
name = "biyo-cozucu"
version = "0.1.0"
description = "Referans çözümlerden öğrenip biyoloji sorularını yerel olarak çözen RAG + LoRA sistemi"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "rapidfuzz>=3.9",
]

[project.optional-dependencies]
# Anlamsal erişim (sentence-transformers ağır; olmadan da BM25 ile çalışır)
gomme = ["sentence-transformers>=3.0"]
# Yerel çıkarım (Apple Silicon)
mlx = ["mlx-lm>=0.31.3"]
# Web arayüzü
web = ["fastapi>=0.115", "jinja2>=3.1", "uvicorn>=0.30", "python-multipart>=0.0.9"]
# Referans PDF alımı
pdf = ["pypdfium2>=4.30"]
# YouTube soru çözümü videolarından alım. Paket kurulsa bile subprocess ile
# çağrılır (bkz. alim/youtube.py): extractor'lar sık bozulur, kullanıcı
# yt-dlp'yi projeden bağımsız güncelleyebilmeli.
youtube = ["yt-dlp>=2025.1"]
# Kitap/çözüm alımı: PDF ve Word. Ses/video için Python paketi YOK — ffmpeg
# ve whisper.cpp harici binary olarak aranır (bkz. alim/ses.py). mlx-whisper
# denendi ve elendi: en güncel sürümü bile numpy 2.x ile bağdaşmayan eski bir
# numba'ya bağlanıyor ve Python 3.12'de derlenmiyor.
alim = ["pypdfium2>=4.30", "python-docx>=1.1"]
# Taranmış (görüntü) PDF'ler için OCR. Motorlar ayrı ekstralara bölündü:
# hepsi aynı platformda sorunsuz kurulmuyor ve tek bir devasa ekstra,
# yalnız birini isteyen kullanıcıya diğerlerinin yükünü bindirirdi.
ocr = ["pypdfium2>=4.30", "pillow>=10.0", "surya-ocr>=0.6", "easyocr>=1.7"]
# Tesseract ayrı: Python paketi yalnız sarmalayıcıdır, `tesseract` ikilisi
# ve `tur` dil verisi sistemden gelmeli.
ocr-tesseract = ["pypdfium2>=4.30", "pillow>=10.0", "pytesseract>=0.3"]
# PaddlePaddle Apple Silicon'da kırılgan olabildiği için ayrı tutuldu.
ocr-paddle = ["pypdfium2>=4.30", "pillow>=10.0", "paddleocr>=2.7", "paddlepaddle>=2.6"]
# Görsel/şekilli soru desteği (Apple Silicon); metin motorundan ayrı yüklenir.
# mlx-vlm alt sınırı 0.3.4: Qwen3-VL bundan önceki sürümlerde tanınmıyor ve
# hata "model bulunamadı" gibi görünüp yanıltıyor.
vizyon = ["mlx-vlm>=0.6.8,<0.7", "pillow>=10.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "fastapi>=0.115",
    "jinja2>=3.1",
    # httpx2: starlette 1.3 TestClient'ı httpx ile kullanmayı bıraktı ve her
    # koşuda bir kullanımdan kaldırma uyarısı basıyordu. Uyarıyı susturmak
    # yerine önerilen pakete geçildi — susturulan uyarı, gerçek uyarıları da
    # gürültüye gömer.
    "httpx2>=2.9",
    "python-multipart>=0.0.9",
    # Arayüz uçtan uca sürülür: akış, tema ve kısayollar yalnız gerçek
    # tarayıcıda doğrulanabiliyor (TestClient JavaScript çalıştırmaz).
    "playwright>=1.47",
    "ruff>=0.9",
    "mypy>=1.13",
]

[project.scripts]
biyo-cozucu = "biyo_cozucu.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["biyo_cozucu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `yavas` işaretli testler (gerçek OCR motorları, tarayıcı e2e) varsayılan
# koşudan çıkarıldı: dakikalar sürüyor ve makinede kurulu ikililere bağlılar.
# Tümünü koşmak için: pytest -m ""
addopts = "-q -m 'not yavas'"
markers = [
    "yavas: gerçek model/ikili yükleyen ya da tarayıcı açan yavaş test",
]

[tool.coverage.run]
source = ["biyo_cozucu"]

[tool.coverage.report]
# 2026-07-27 ölçümü: hızlı koşuda %80,2 (tam koşuda %82 — aradaki fark
# `yavas` işaretli gerçek OCR testleri). Eşik oraya değil, pay bırakarak
# altına konuldu: amaç gerilemeyi yakalamak, küçük dalgalanmada koşuyu
# kırmak değil. Bilinen sıfırlar: alim/ses.py ve motor/http_motor.py —
# ikisi de test yazıldıkça bu sayıyı belirgin yükseltecek, o zaman artır.
fail_under = 78
show_missing = true

[tool.ruff]
# Kod ~88 sütuna göre yazılmış ama birkaç uzun tablo/istem satırı var;
# 100, mevcut biçimi toplu yeniden düzenlemeden yakalayan sınır.
line-length = 100
target-version = "py311"
# Colab defteri ayrı bir çalıştırma ortamına ait; proje kurallarına tabi değil.
# `notebooks/*_colab.ipynb` de aynı sınıf: `!pip install`, tek satırda çoklu
# import ve kısa yollu `subprocess` çağrıları Colab deyimidir, proje kodu değil.
# Kalıp bilerek dar: buraya konacak gerçek bir proje defteri yine denetlenir.
extend-exclude = ["colab", "notebooks/*_colab.ipynb"]

[tool.ruff.lint]
# Kodda zaten geçen `# noqa` kodlarının varsaydığı kural setleri:
# BLE001, F401, E402, S603, SLF001 → E/F, BLE, S, SLF. Üzerine yaygın
# ve düşük gürültülü setler eklendi.
select = ["E", "F", "W", "I", "UP", "B", "BLE", "S", "SLF", "C4", "SIM", "RUF"]
ignore = [
    "E501",    # satır uzunluğu formatter'ın işi
    "RUF001",  # Türkçe metinlerde "belirsiz" unicode karakter uyarısı gürültü
    "RUF002",
    "RUF003",
    # Aşağıdakiler projenin BİLİNÇLİ tasarım kararlarına çarpıyor; kural
    # açık bırakılırsa her koşuda aynı 15+ yanlış pozitif üretir.
    "S310",    # urllib.urlopen — SDK bağımlılığı istemeyerek reddedildi (motor/http_motor.py:3)
    "S608",    # SQL dizgi kurulumu — ORM yok, şema tek yerde (depo.py:3)
    "B008",    # FastAPI'nin Form()/Depends() varsayılan-argüman deyimi
]

[tool.ruff.lint.per-file-ignores]
# Testlerde assert (S101) ve sabit kodlanmış "parola benzeri" dizgiler doğaldır.
"tests/*" = ["S101", "S105", "S106", "SLF001"]

[tool.mypy]
# `python_version` bilinçli olarak verilmedi: 3.11'e sabitlenince numpy'nin
# kendi .pyi dosyaları "type statement 3.12+ ister" diye patlıyor ve hiçbir
# dosya denetlenemiyor. 3.11 uyumluluğunu ruff'ın target-version'ı koruyor.
# Kademeli benimseme: önce saf modüller. Kapsam genişledikçe bu liste büyür.
files = ["biyo_cozucu/modeller.py", "biyo_cozucu/metin.py", "biyo_cozucu/veri"]
ignore_missing_imports = true
warn_unused_ignores = true
