name: Bilgili kaynak aktarımı

# Drive'da bağlantıyla paylaşılan Bilgili kaynak arşivini indirir ve
# uygulamalar/android/bilgili_flutter/ dizinine işler.
on:
  push:
    branches: [ccr-07c70646-5qw9pg]
    paths:
      - '.github/workflows/bilgili-kaynak-aktar.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bilgili-kaynak-aktar
  cancel-in-progress: false

env:
  DRIVE_FILE_ID: 12NvlPFHHL1yYpTP4W1Sv-MAIuKZXDY_f
  HEDEF: uygulamalar/android/bilgili_flutter

jobs:
  aktar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Arşivi indir
        run: |
          set -euo pipefail
          curl -sS -L --fail --retry 4 --retry-delay 5 \
            -o "$RUNNER_TEMP/kaynak.zip" \
            "https://drive.usercontent.google.com/download?id=${DRIVE_FILE_ID}&export=download&confirm=t"
          ls -l "$RUNNER_TEMP/kaynak.zip"
          sha256sum "$RUNNER_TEMP/kaynak.zip"
          if ! unzip -tq "$RUNNER_TEMP/kaynak.zip" >/dev/null; then
            echo "::error::İndirilen dosya geçerli bir zip değil"
            head -c 600 "$RUNNER_TEMP/kaynak.zip" || true
            exit 1
          fi

      - name: Arşivi aç ve incele
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/kaynak"
          unzip -q "$RUNNER_TEMP/kaynak.zip" -d "$RUNNER_TEMP/kaynak"
          cd "$RUNNER_TEMP/kaynak"
          echo "== Üst düzey =="
          ls -la
          echo "== Dosya sayısı =="
          find . -type f | wc -l
          echo "== pubspec.yaml konumları =="
          find . -name pubspec.yaml -not -path '*/.dart_tool/*' -not -path '*/build/*' | head -20
          echo "== En büyük 30 dosya =="
          find . -type f -printf '%s\t%p\n' | sort -rn | head -30
          echo "== Depoya alınmayacak hassas görünen dosyalar (yalnız adlar) =="
          find . -type f \( -name '*.jks' -o -name '*.keystore' -o -name 'key.properties' \
            -o -name 'local.properties' -o -name '.env' -o -name '.env.*' \
            -o -name '*.p12' -o -name '*.pem' -o -name 'google-services.json' \) | sort || true

      - name: Depoya işle
        run: |
          set -euo pipefail
          KOK="$(find "$RUNNER_TEMP/kaynak" -name pubspec.yaml \
            -not -path '*/.dart_tool/*' -not -path '*/build/*' -not -path '*/.pub-cache/*' \
            -printf '%d\t%h\n' | sort -n | head -1 | cut -f2)"
          if [ -z "$KOK" ]; then
            echo "::error::Arşivde pubspec.yaml bulunamadı"; exit 1
          fi
          echo "Proje kökü: $KOK"
          grep -E '^(name|version|description):' "$KOK/pubspec.yaml"
          mkdir -p "$HEDEF"
          rsync -a --delete \
            --exclude '.git/' --exclude '__MACOSX/' --exclude '.DS_Store' \
            --exclude 'build/' --exclude '.dart_tool/' --exclude '.gradle/' \
            --exclude '.idea/' --exclude '.kotlin/' --exclude '.cxx/' \
            --exclude 'Pods/' --exclude '.pub-cache/' --exclude '.flutter-plugins' \
            --exclude '*.apk' --exclude '*.aab' --exclude '*.iml' \
            --exclude '*.jks' --exclude '*.keystore' --exclude 'key.properties' \
            --exclude 'local.properties' --exclude '.env' --exclude '.env.*' \
            --exclude '*.p12' --exclude '*.pem' --exclude 'google-services.json' \
            "$KOK/" "$HEDEF/"
          echo "== 95 MB üstü dosyalar (olmamalı) =="
          BUYUK="$(find "$HEDEF" -type f -size +95M)"
          if [ -n "$BUYUK" ]; then echo "$BUYUK"; echo "::error::GitHub sınırını aşan dosya var"; exit 1; fi
          echo "== İşlenen ağaç özeti =="
          find "$HEDEF" -type f | wc -l
          du -sh "$HEDEF"
          find "$HEDEF" -maxdepth 2 -not -path '*/.git/*' | sort | head -80

      - name: Commit ve push
        run: |
          set -euo pipefail
          SURUM="$(grep -E '^version:' "$HEDEF/pubspec.yaml" | awk '{print $2}')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A "$HEDEF"
          if git diff --cached --quiet; then
            echo "Değişiklik yok"; exit 0
          fi
          git diff --cached --stat | tail -5
          git commit -q -m "Import bilgili_flutter (Android) ${SURUM}" \
            -m "Drive'daki Bilgili-3.8.0-Kaynak.zip arşivinden aktarıldı." \
            -m "Co-Authored-By: Claude Fable 5.2 <noreply@anthropic.com>
          Claude-Session: https://claude.ai/code/session_01LtUQK5psYQS6jK4ZQJ7mV1"
          git push origin "HEAD:${GITHUB_REF_NAME}"
